<style>
html,body{margin:0;background:#1c1a52}
.boot{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:18px;background:radial-gradient(60% 50% at 50% 42%,#1a245c 0,#111940 100%);color:#f5f5fa;font-family:'Playfair Display',Georgia,serif}
.boot svg{width:84px;height:84px;animation:boot-spin 6s linear infinite}
.boot b{font:400 52px/1 'Great Vibes',cursive;color:#e85266}
.boot small{font:500 10px/1 Archivo,system-ui,sans-serif;letter-spacing:.5em;padding-left:.5em;color:#e85266}
.boot i{display:block;width:150px;height:2px;border-radius:2px;background:rgba(232, 82, 102,.22);overflow:hidden;position:relative}
.boot i::after{content:'';position:absolute;inset:0;width:40%;background:#e85266;border-radius:2px;animation:boot-bar 1.3s ease-in-out infinite}
@keyframes boot-spin{to{transform:rotate(360deg)}}
@keyframes boot-bar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){.boot svg,.boot i::after{animation:none}}
</style>
